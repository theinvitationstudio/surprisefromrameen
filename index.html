<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A little surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&family=Shrikhand&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one centered scrapbook card on a striped lilac table; bunnies and hearts drift around it; a private editor sits under the card at #edit. */
:root {
  --lilac: #b9a2ec;
  --lilac-deep: #6f56c4;
  --butter: #fbeeb4;
  --cream: #fff9e8;
  --ink: #3b2a73;
  --berry: #d93a5c;
  --display: "Shrikhand", "Georgia", serif;
  --body: "Nunito", system-ui, sans-serif;
  --hand: "Caveat", "Segoe Script", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--lilac);
  background-image: repeating-linear-gradient(90deg, var(--lilac) 0 44px, #c7b4f2 44px 88px);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 600;
  min-height: 100vh;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 22px;
}
.card {
  width: 100%;
  max-width: 520px;
  min-height: 620px;
  background: var(--cream);
  border: 5px solid var(--lilac-deep);
  border-radius: 38px 26px 42px 28px;
  box-shadow: 8px 8px 0 var(--lilac-deep);
  padding: 28px 20px;
  position: relative;
  overflow: hidden;
  display: grid;
  align-content: center;
  justify-items: center;
  text-align: center;
  gap: 18px;
  z-index: 1;
}
.screen { display: grid; justify-items: center; gap: 16px; width: 100%; min-width: 0; animation: pop .45s ease both; position: relative; z-index: 1; }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; color: var(--lilac-deep); overflow-wrap: anywhere; }
h1 { font-size: clamp(2rem, 8vw, 2.8rem); }
p { margin: 0; line-height: 1.45; }
.hand { font-family: var(--hand); font-size: 1.7rem; font-weight: 700; color: var(--berry); }
.sign {
  background: var(--butter); border: 4px solid var(--lilac-deep); border-radius: 20px;
  padding: 16px 20px; font-family: var(--display); font-size: clamp(1.25rem, 5.5vw, 1.65rem);
  color: var(--ink); line-height: 1.25; max-width: 100%; overflow-wrap: anywhere;
}
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.btn {
  background: var(--berry); color: #fff; border: 3px solid var(--ink); border-radius: 999px;
  padding: 12px 30px; font-family: var(--display); font-size: 1.3rem; box-shadow: 0 5px 0 var(--ink);
  transition: transform .12s, box-shadow .12s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--butter); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding-bottom: 6px; }

/* bunnies + hearts */
.pair { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.bun { width: 96px; height: 125px; display: block; overflow: visible; cursor: pointer; transition: translate .15s; }
.bun:hover { translate: 0 -4px; }
.pair.small .bun { width: 70px; height: 91px; }
.b1 { --fur: #ffffff; }
.b2 { --fur: #f8d3e0; }
.pair .bun:first-child { transform: rotate(6deg); }
.pair .bun:last-child { transform: scaleX(-1) rotate(6deg); }
.pair .mid { width: 34px; height: 32px; margin-bottom: 52px; animation: beat 1.2s ease-in-out infinite; }
.pair.small .mid { width: 26px; height: 24px; margin-bottom: 36px; }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
.hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.hearts span { position: absolute; bottom: -40px; color: var(--berry); opacity: 0; animation: floatup linear infinite; }
@keyframes floatup { 0% { transform: translateY(0) rotate(-8deg); opacity: 0; } 12% { opacity: .75; } 100% { transform: translateY(-110vh) rotate(10deg); opacity: 0; } }
.deco { position: absolute; color: var(--berry); font-size: 1.3rem; pointer-events: none; }

/* how dare you */
.dare { font-family: var(--display); color: var(--berry); font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: 1; transform: rotate(-4deg); text-shadow: 3px 3px 0 var(--butter); }
.flip .bun { transform: rotate(180deg); }
.flip { animation: wobble 1.4s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

/* keypad */
.dots { display: flex; gap: 12px; }
.dots i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--lilac-deep); background: transparent; }
.dots i.on { background: var(--berry); border-color: var(--berry); }
.dots.bad { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
.pad { display: grid; grid-template-columns: repeat(3, 64px); gap: 10px; }
.pad button {
  height: 54px; border-radius: 16px; border: 3px solid var(--lilac-deep); background: var(--butter);
  color: var(--ink); font-family: var(--display); font-size: 1.4rem;
}
.pad button:active { background: var(--lilac); }
.taunt { min-height: 1.5em; font-size: .95rem; }

/* gifts */
.gifts { display: flex; gap: 8px; justify-content: center; width: 100%; }
.gift { background: none; border: 0; padding: 0; width: 30%; max-width: 120px; transition: transform .2s; }
.gift:hover { transform: translateY(-6px) rotate(-3deg); }
.gift svg { width: 100%; height: auto; display: block; overflow: visible; }
.gift .lid { transition: transform .5s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 100%; }
.gift.open .lid { transform: translateY(-34px) rotate(-14deg); }
.gift.open { cursor: default; transform: none; }
.note { background: var(--butter); border: 3px dashed var(--lilac-deep); border-radius: 18px; padding: 14px 18px; min-height: 4.2em; width: 100%; font-size: 1.05rem; display: grid; align-items: center; overflow-wrap: anywhere; }

/* reasons */
.reason-card { position: relative; width: 100%; min-height: 150px; background: var(--butter); border: 4px solid var(--lilac-deep); border-radius: 22px; padding: 16px; display: grid; gap: 4px; justify-items: center; align-content: center; box-shadow: 5px 5px 0 rgba(59,42,115,.25); }
.reason-card.pop { animation: rpop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes rpop { from { transform: scale(.7) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
.r-emoji { font-size: 2.3rem; line-height: 1.1; }
.r-text { font-family: var(--hand); font-size: 1.75rem; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
.r-count { font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--lilac-deep); }
.hearts-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.hearts-row svg { width: 22px; height: 21px; opacity: .25; filter: grayscale(.7); transition: opacity .3s, transform .3s; }
.hearts-row svg.on { opacity: 1; filter: none; transform: scale(1.2); }
.big-heart { background: none; border: 0; padding: 0; width: 84px; animation: beat 1.2s ease-in-out infinite; }
.big-heart svg { width: 100%; height: auto; display: block; }
.big-heart:active { transform: scale(.88); }
.tapme { font-family: var(--hand); font-size: 1.4rem; color: var(--berry); margin-top: -8px; }
.floaters { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.floaters span { position: absolute; bottom: 22%; font-size: 1.7rem; animation: rise 1.7s ease-out forwards; }
@keyframes rise { 0% { transform: translateY(0) scale(.5); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx, 0), -200px) scale(1.2) rotate(var(--rot, 0deg)); opacity: 0; } }

/* wish */
.cake { width: min(300px, 92%); height: auto; overflow: visible; }
.flame { transform-origin: 50% 100%; animation: flick .5s ease-in-out infinite alternate; transition: opacity .4s; }
.candle { cursor: pointer; }
.candle.out .flame { opacity: 0; animation: none; }
@keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.9, 1.12) rotate(3deg); } }
.wishnote { font-family: var(--hand); font-size: 2.2rem; color: var(--berry); min-height: 1.3em; overflow-wrap: anywhere; }

/* final */
.photo {
  position: relative; width: min(210px, 66%); aspect-ratio: 4 / 5; background: #fff;
  border: 3px solid var(--ink); padding: 10px 10px 30px; transform: rotate(-3deg);
  box-shadow: 5px 5px 0 rgba(59,42,115,.25);
}
.photo .in { display: grid; place-items: center; width: 100%; height: 100%; background: var(--butter); overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .in svg { width: 46%; height: auto; }
.letter { font-family: var(--hand); font-size: 1.5rem; line-height: 1.3; max-width: 32ch; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

/* editor (only at #edit) */
.editor { width: 100%; max-width: 520px; background: #fff; border: 4px solid var(--ink); border-radius: 22px; padding: 18px; display: grid; gap: 12px; z-index: 1; position: relative; text-align: left; }
.editor h2 { font-size: 1.5rem; }
.editor label { display: grid; gap: 4px; font-weight: 800; font-size: .9rem; }
.editor input[type=text], .editor textarea { font: inherit; font-weight: 600; color: var(--ink); background: var(--cream); border: 2px solid var(--lilac-deep); border-radius: 12px; padding: 9px 12px; width: 100%; min-width: 0; }
.editor textarea { min-height: 76px; resize: vertical; }
.editor .jump { display: flex; flex-wrap: wrap; gap: 8px; }
.editor .jump button, .editor .small { background: var(--butter); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 800; justify-self: start; }
.editor .status { min-height: 1.4em; font-size: .95rem; }
.editor .btn { justify-self: start; }
@media (prefers-reduced-motion: reduce) { .screen, .dots.bad, .pair .mid, .flip, .flame, .big-heart, .reason-card.pop { animation: none; } .hearts { display: none; } .gift, .gift .lid { transition: none; } }
</style>
</head>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<main class="card" id="card">
  <span class="deco" style="top:12px;left:18px" aria-hidden="true">♥</span>
  <span class="deco" style="top:20px;right:24px" aria-hidden="true">✦</span>
  <span class="deco" style="bottom:14px;left:26px" aria-hidden="true">✦</span>
  <span class="deco" style="bottom:18px;right:20px" aria-hidden="true">♥</span>

  <!-- 1. gate -->
  <section class="screen" id="s-gate">
    <div class="pair" role="img" aria-label="Two bunnies with a heart between them">
      <svg class="bun b1" data-face="love" role="button" tabindex="0" aria-label="Bunny, tap to change its face"><use href="#bun"/><use class="face" href="#f-love"/></svg><svg class="mid"><use href="#heart"/></svg><svg class="bun b2" data-face="shy" role="button" tabindex="0" aria-label="Bunny, tap to change its face"><use href="#bun"/><use href="#bow"/><use class="face" href="#f-shy"/></svg>
    </div>
    <div class="sign" id="gate-text"></div>
    <div class="row">
      <button class="btn" id="yes" type="button">YES</button>
      <button class="btn alt" id="no" type="button">NO</button>
    </div>
  </section>

  <!-- 1b. how dare you -->
  <section class="screen" id="s-dare" hidden>
    <div class="dare" id="dare-text"></div>
    <div class="pair flip" role="img" aria-label="An upside-down bunny">
      <svg class="bun b2" data-face="sulk" aria-hidden="true"><use href="#bun"/><use href="#bow"/><use class="face" href="#f-sulk"/></svg>
    </div>
    <button class="btn" id="try" type="button">TRY AGAIN</button>
  </section>

  <!-- 2. are you excited -->

    <h1 id="excited-text"></h1>
    <div class="pair" role="img" aria-label="Two bunnies with a heart between them">

      <button class="btn" id="yes2" type="button">YES!!</button>

  <section class="screen" id="s-wish" hidden>
    <h1 id="wish-title"></h1>
    <svg class="cake" id="cake" viewBox="0 0 300 230" role="img" aria-label="A birthday cake with five candles">
      <rect x="20" y="140" width="260" height="84" rx="12" fill="#d93a5c" stroke="#3b2a73" stroke-width="4"/>
      <rect x="62" y="86" width="176" height="58" rx="10" fill="#f8d3e0" stroke="#3b2a73" stroke-width="4"/>
      <path d="M20 150 Q35 176 50 150 T80 150 T110 150 T140 150 T170 150 T200 150 T230 150 T260 150 T280 150 L280 138 L20 138Z" fill="#fff9e8" stroke="#3b2a73" stroke-width="4" stroke-linejoin="round"/>
      <path d="M62 94 Q77 118 92 94 T122 94 T152 94 T182 94 T212 94 T238 94 L238 84 L62 84Z" fill="#fff9e8" stroke="#3b2a73" stroke-width="4" stroke-linejoin="round"/>
      <use href="#heart" x="58" y="184" width="26" height="24"/><use href="#heart" x="137" y="190" width="26" height="24"/><use href="#heart" x="216" y="184" width="26" height="24"/>
      <g id="candles"></g>
    </svg>
    <div class="wishnote" id="wish-note" aria-live="polite"></div>
    <button class="btn alt" id="blow" type="button">Blow the candles</button>
    <button class="btn" id="to-letter" type="button" hidden>Open my letter</button>
  </section>

  <!-- 7. final -->
  <section class="screen" id="s-final" hidden>
    <h1 id="hb"></h1>
    <div class="pair small" role="group" aria-label="Two bunnies with a heart between them"><svg class="bun b1" data-face="love" role="button" tabindex="0" aria-label="Bunny, tap to change its face"><use href="#bun"/><use class="face" href="#f-love"/></svg><svg class="mid"><use href="#heart"/></svg><svg class="bun b2" data-face="happy" role="button" tabindex="0" aria-label="Bunny, tap to change its face"><use href="#bun"/><use href="#bow"/><use class="face" href="#f-happy"/></svg></div>
    <div class="photo"><div class="in" id="photo"></div></div>
    <p class="letter" id="letter"></p>
    <button class="btn alt" id="again" type="button">Celebrate again</button>
  </section>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script src="config.js"></script>
<script>
var C = window.CONFIG || {};
var STATE = {
  name: C.name || "", gateText: C.gateText || "", dareText: C.dareText || "", excitedText: C.excitedText || "",
  passcode: String(C.passcode || "1234").replace(/\D/g, "") || "1234", hint: C.hint || "",
  gifts: (C.gifts && C.gifts.length ? C.gifts : ["Happy birthday!"]).slice(0, 3),
  reasonsTitle: C.reasonsTitle || "Reasons why I love you", reasons: (C.reasons && C.reasons.length ? C.reasons : ["You are loved."]).slice(0, 10), wishTitle: C.wishTitle || "MAKE A WISH", wishNote: C.wishNote || "",
  letter: C.letter || "", photo: C.photo || ""
};
document.title = C.tabTitle || "A little surprise";
var $ = function (id) { return document.getElementById(id); };
var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var SCREENS = ["s-gate", "s-dare", "s-excited", "s-lock", "s-gifts", "s-reasons", "s-wish", "s-final"];

function show(id) {
  SCREENS.forEach(function (s) { $(s).hidden = (s !== id); });
  window.scrollTo(0, 0);
}

/* floating hearts */
(function () {
  var box = $("hearts");
  for (var i = 0; i < 14; i++) {
    var s = document.createElement("span");
    s.textContent = "♥";
    s.style.left = (Math.random() * 96) + "%";
    s.style.fontSize = (14 + Math.random() * 22) + "px";
    s.style.animationDuration = (9 + Math.random() * 9) + "s";
    s.style.animationDelay = (-Math.random() * 14) + "s";
    box.appendChild(s);
  }
})();

/* gate -> dare / excited */
$("yes").addEventListener("click", function () { show("s-excited"); });
$("no").addEventListener("click", function () { show("s-dare"); });
$("try").addEventListener("click", function () { show("s-gate"); });
function goLock() { burst(.5, .5, 30, true); show("s-lock"); }
$("yes1").addEventListener("click", goLock);
$("yes2").addEventListener("click", goLock);

/* passcode */
var entered = "";
["1","2","3","4","5","6","7","8","9","del","0","ok"].forEach(function (k) {
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = k === "del" ? "⌫" : (k === "ok" ? "✓" : k);
  b.setAttribute("aria-label", k === "del" ? "Delete" : (k === "ok" ? "Enter" : k));
  b.addEventListener("click", function () { press(k); });
  $("pad").appendChild(b);
});
function buildDots() {
  $("dots").innerHTML = "";
  for (var i = 0; i < STATE.passcode.length; i++) $("dots").appendChild(document.createElement("i"));
  entered = ""; paint();
}
function paint() {
  var d = $("dots").children;
  for (var i = 0; i < d.length; i++) d[i].className = i < entered.length ? "on" : "";
}
function press(k) {
  if (k === "del") entered = entered.slice(0, -1);
  else if (k === "ok") { check(); return; }
  else if (entered.length < STATE.passcode.length) entered += k;
  paint();
  if (entered.length === STATE.passcode.length && k !== "del") check();
}
function check() {
  if (entered === STATE.passcode) { $("lock-msg").textContent = ""; entered = ""; paint(); burst(.5, .4, 30, true); show("s-gifts"); }
  else {
    $("lock-msg").textContent = "Not quite. Try again.";
    var dots = $("dots"); dots.classList.remove("bad"); void dots.offsetWidth; dots.classList.add("bad");
    entered = ""; paint();
  }
}
document.addEventListener("keydown", function (e) {
  if ($("s-lock").hidden) return;
  var t = e.target && e.target.tagName;
  if (t === "INPUT" || t === "TEXTAREA") return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") press("del");
  else if (e.key === "Enter") press("ok");
});

/* gifts */
var opened = 0;
var tints = ["#d93a5c", "#3f8f7a", "#e0892f"];
function buildGifts() {
  opened = 0; $("gifts").innerHTML = ""; $("last").hidden = true; $("note").textContent = "Tap a box.";
  STATE.gifts.forEach(function (msg, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "gift"; b.setAttribute("aria-label", "Gift " + (i + 1));
    var c = tints[i % tints.length];
    b.innerHTML =
      '<svg viewBox="0 0 100 110">' +
      '<rect x="12" y="46" width="76" height="58" rx="4" fill="' + c + '" stroke="#3b2a73" stroke-width="4"/>' +
      '<rect x="44" y="46" width="12" height="58" fill="#f4d46a" stroke="#3b2a73" stroke-width="3"/>' +
      '<g class="lid"><rect x="6" y="28" width="88" height="22" rx="4" fill="' + c + '" stroke="#3b2a73" stroke-width="4"/>' +
      '<rect x="44" y="28" width="12" height="22" fill="#f4d46a" stroke="#3b2a73" stroke-width="3"/>' +
      '<path d="M50 28 C30 2 14 14 28 26 Z M50 28 C70 2 86 14 72 26 Z" fill="#f4d46a" stroke="#3b2a73" stroke-width="3" stroke-linejoin="round"/></g></svg>';
    b.addEventListener("click", function () {
      if (!b.classList.contains("open")) {
        b.classList.add("open"); opened++;
        if (opened === STATE.gifts.length) $("last").hidden = false;
        burst(.5, .5, 36, true);
      }
      $("note").textContent = STATE.gifts[i];
    });
    $("gifts").appendChild(b);
  });
}
$("last").addEventListener("click", function () { resetReasons(); show("s-reasons"); });

/* reasons */
var EMOJIS = ["💖", "🥰", "🌸", "✨", "🧸", "🍓", "🌈", "💌", "🐰", "🫶"];
var RFACES = ["love", "happy", "wink", "shy", "wow"];
var rIndex = 0;
function setFace(el, f) { el.setAttribute("data-face", f); var u = el.querySelector(".face"); if (u) u.setAttribute("href", "#f-" + f); }
function resetReasons() {
  rIndex = 0;
  $("r-emoji").textContent = "💌"; $("r-text").textContent = "Tap the heart to open a reason."; $("r-count").textContent = "";
  $("r-tap").hidden = false; $("r-hint").hidden = false; $("to-wish").hidden = true;
  var p = $("r-progress"); p.innerHTML = "";
  STATE.reasons.forEach(function () { var h = document.createElementNS("http://www.w3.org/2000/svg", "svg"); h.setAttribute("viewBox", "0 0 32 30"); h.innerHTML = '<use href="#heart"/>'; p.appendChild(h); });
  var bs = $("reasons-pair").querySelectorAll(".bun"); setFace(bs[0], "love"); setFace(bs[1], "shy");
}
function floatEmojis(e) {
  if (reduce) return;
  var box = $("floaters"), pool = [e, e, "💖", "✨", "🌸"];
  for (var i = 0; i < 9; i++) {
    var sp = document.createElement("span");
    sp.textContent = pool[i % pool.length];
    sp.style.left = (8 + Math.random() * 84) + "%";
    sp.style.setProperty("--dx", ((Math.random() - .5) * 90) + "px");
    sp.style.setProperty("--rot", ((Math.random() - .5) * 50) + "deg");
    sp.style.animationDelay = (Math.random() * .35) + "s";
    sp.addEventListener("animationend", function () { this.remove(); });
    box.appendChild(sp);
  }
}
function nextReason() {
  if (rIndex >= STATE.reasons.length) return;
  var i = rIndex++, card = $("reason-card"), e = EMOJIS[i % EMOJIS.length];
  $("r-emoji").textContent = e;
  $("r-text").textContent = STATE.reasons[i];
  $("r-count").textContent = "Reason " + (i + 1) + " of " + STATE.reasons.length;
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
  var ps = $("r-progress").children; if (ps[i]) ps[i].setAttribute("class", "on");
  var bs = $("reasons-pair").querySelectorAll(".bun");
  setFace(bs[0], RFACES[i % 5]); setFace(bs[1], RFACES[(i + 2) % 5]);
  floatEmojis(e); burst(.5, .55, 14, true);
  if (rIndex >= STATE.reasons.length) { $("r-tap").hidden = true; $("r-hint").hidden = true; $("to-wish").hidden = false; }
}
$("r-tap").addEventListener("click", nextReason);
$("to-wish").addEventListener("click", function () { resetWish(); show("s-wish"); });

/* wish */
var candleX = [90, 120, 150, 180, 210], outCount = 0;
function resetWish() {
  outCount = 0; $("wish-note").textContent = ""; $("to-letter").hidden = true; $("blow").hidden = false;
  var g = $("candles"); g.innerHTML = "";
  var NS = "http://www.w3.org/2000/svg";
  candleX.forEach(function (x, i) {
    var c = document.createElementNS(NS, "g"); c.setAttribute("class", "candle");
    c.innerHTML =
      '<rect x="' + (x - 6) + '" y="46" width="12" height="40" rx="2" fill="' + (i % 2 ? "#fff9e8" : "#d93a5c") + '" stroke="#3b2a73" stroke-width="3"/>' +
      '<g class="flame"><path d="M' + x + ' 14 C' + (x + 9) + ' 26 ' + (x + 7) + ' 40 ' + x + ' 40 C' + (x - 7) + ' 40 ' + (x - 9) + ' 26 ' + x + ' 14Z" fill="#ffb82e" stroke="#3b2a73" stroke-width="2"/>' +
      '<path d="M' + x + ' 26 C' + (x + 4) + ' 32 ' + (x + 3) + ' 38 ' + x + ' 38 C' + (x - 3) + ' 38 ' + (x - 4) + ' 32 ' + x + ' 26Z" fill="#fff3a0"/></g>';
    c.addEventListener("click", function () { snuff(c); });
    g.appendChild(c);
  });
}
function snuff(c) {
  if (c.classList.contains("out")) return;
  c.classList.add("out"); outCount++;
  if (outCount === candleX.length) {
    $("wish-note").textContent = STATE.wishNote; $("blow").hidden = true; $("to-letter").hidden = false;
    party();
  }
}
$("blow").addEventListener("click", function () {
  var cs = $("candles").children;
  for (var i = 0; i < cs.length; i++) (function (c, d) { setTimeout(function () { snuff(c); }, reduce ? 0 : d); })(cs[i], i * 220);
});
$("to-letter").addEventListener("click", function () { show("s-final"); party(); });
$("again").addEventListener("click", party);

/* fill the page from the saved text */
function applyState() {
  $("gate-text").textContent = STATE.gateText;
  $("dare-text").textContent = STATE.dareText;
  $("excited-text").textContent = STATE.excitedText;
  $("hint").textContent = STATE.hint;
  $("wish-title").textContent = STATE.wishTitle;
  $("hb").textContent = "Happy Birthday, " + STATE.name + "!";
  $("letter").textContent = STATE.letter;
  var ph = $("photo"); ph.innerHTML = "";
  if (STATE.photo) { var im = new Image(); im.alt = "Photo"; im.src = STATE.photo; ph.appendChild(im); }
  else ph.innerHTML = '<svg viewBox="0 0 32 30" aria-hidden="true"><use href="#heart"/></svg>';
  $("reasons-title").textContent = STATE.reasonsTitle;
}
applyState(); buildDots(); buildGifts(); resetWish(); resetReasons();

/* confetti, with hearts */
var cv = $("confetti"), cx = cv.getContext("2d"), bits = [], raf = 0;
function size() { cv.width = innerWidth; cv.height = innerHeight; }
size(); addEventListener("resize", size);
var cols = ["#d93a5c", "#6f56c4", "#f4d46a", "#3f8f7a", "#f4a6b8"];
function burst(x, y, n, hearty) {
  if (reduce) return;
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 7;
    bits.push({ x: x * cv.width, y: y * cv.height, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, w: 8 + Math.random() * 8, h: 5 + Math.random() * 5, r: Math.random() * 6, vr: Math.random() * .3 - .15, c: cols[i % cols.length], life: 120, heart: hearty ? i % 2 === 0 : i % 3 === 0 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function party() { burst(.2, .3, 60); burst(.8, .3, 60); burst(.5, .2, 80); }
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits = bits.filter(function (p) { return p.life > 0 && p.y < cv.height + 20; });
  bits.forEach(function (p) {
    p.vy += .25; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.heart ? p.r * .15 : p.r); cx.globalAlpha = Math.min(1, p.life / 30);
    if (p.heart) { cx.fillStyle = "#d93a5c"; cx.font = (p.w * 2) + "px serif"; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("♥", 0, 0); }
    else { cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
    cx.restore();
  });
  raf = bits.length ? requestAnimationFrame(tick) : 0;
}

/* tap a bunny to change its face */
var FACES = ["love", "happy", "wink", "shy", "wow"];
function nextFace(el) {
  var cur = el.getAttribute("data-face"), i = FACES.indexOf(cur);
  var nx = FACES[(i + 1) % FACES.length];
  el.setAttribute("data-face", nx);
  var f = el.querySelector(".face"); if (f) f.setAttribute("href", "#f-" + nx);
  var r = el.getBoundingClientRect(); burst((r.left + r.width / 2) / innerWidth, (r.top + 20) / innerHeight, 8, true);
}
Array.prototype.forEach.call(document.querySelectorAll(".bun[role=button]"), function (el) {
  el.addEventListener("click", function () { nextFace(el); });
  el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nextFace(el); } });
});
</script>
</body>
</html>
